<table>
    <tr>
        <th>Team</th>
        <th>Wins</th>
        <th>Losses</th>
        <th>Run Diff</th>
    </tr>
    {% for team in sorted_standings %}
    <tr>
        <td>{{ team }}</td>
        <td>{{ standings[team]['wins'] }}</td>
        <td>{{ standings[team]['losses'] }}</td>
        <td>{{ standings[team]['run_diff'] }}</td>
    </tr>
    {% endfor %}
</table>
