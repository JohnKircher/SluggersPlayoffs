<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Scores</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .games {
            flex: 1;
        }
        .standings {
            flex: 1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .input-group {
            margin-bottom: 10px;
        }
        .input-group label {
            display: inline-block;
            width: 150px;
        }
        .input-group input {
            width: 60px;
        }
        .reset-button {
            margin-top: 20px;
            background: red;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        /* Center probability table */
        .probabilities-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
        }
        
        .highlight-gold {
            background-color: #FFD700; /* Gold */
            font-weight: bold;
        }

        .highlight-green {
            background-color: #90EE90; /* Light Green */
            font-weight: bold;
        }

        .highlight-red {
            background-color: #FF6347; /* Tomato Red */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Enter Scores for Remaining Games</h1>
    <div class="container">
        <div class="games">
            <form id="score-form">
                {% for i, game in remaining_games %}
                    {% set team1, team2 = game %}
                    <div class="input-group">
                        <label>{{ team1 }} vs {{ team2 }}:</label>
                        <input type="number" name="{{ team1 }}_score_{{ i }}" 
                               value="{{ request.form.get(team1 ~ '_score_' ~ i, 0) }}" required
                               oninput="updateScore('{{ team1 }}', '{{ team2 }}', {{ i }})">
                        <input type="number" name="{{ team2 }}_score_{{ i }}" 
                               value="{{ request.form.get(team2 ~ '_score_' ~ i, 0) }}" required
                               oninput="updateScore('{{ team1 }}', '{{ team2 }}', {{ i }})">
                    </div>
                {% endfor %}
            </form>
            <button class="reset-button" onclick="resetScores()">Reset Standings & Scores</button>
        </div>
        <div class="standings">
            <h2>Current Standings</h2>
            <div id="standings-table">
                {% include 'standings_table.html' %}
            </div>
        </div>
    </div>

    <!-- Centered Probability Table -->
    <div class="probabilities-container">
        <div>
            <h2 style="text-align: center;">Live Playoff Probabilities</h2>
            <div id="probabilities-table">
                {% include 'probabilities_table.html' %}
            </div>
        </div>
    </div>

    <script>
        let debounceTimeout;

        function updateScore(team1, team2, index) {
            clearTimeout(debounceTimeout);
            debounceTimeout = setTimeout(() => {
                let score1 = document.querySelector(`input[name='${team1}_score_${index}']`).value;
                let score2 = document.querySelector(`input[name='${team2}_score_${index}']`).value;

                fetch('/update-score', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        team1: team1,
                        team2: team2,
                        score1: score1,
                        score2: score2,
                        index: index
                    })
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('standings-table').innerHTML = data.standings_html;
                    document.getElementById('probabilities-table').innerHTML = data.probabilities_html;
                })
                .catch(error => console.error('Error updating score:', error));
            }, 500); // Adjust the delay as needed
        }

        

        function resetScores() {
            fetch('/reset-scores', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('standings-table').innerHTML = data.standings_html;
                document.getElementById('probabilities-table').innerHTML = data.probabilities_html;

                // Reset all input fields to 0
                document.querySelectorAll("input[type='number']").forEach(input => input.value = 0);
            })
            .catch(error => console.error('Error resetting scores:', error));
        }

        function highlight100PercentValues() {
            // Find all probability table cells and highlight if the text is "100%"
            document.querySelectorAll('#probabilities-table td').forEach(cell => {
                if (cell.innerText.trim() === "100%") {
                    cell.classList.add('highlight-green');
                } else {
                    cell.classList.remove('highlight-green');
                }
            });
        }

        // Run highlighting on initial load in case there are already 100% values
        document.addEventListener('DOMContentLoaded', highlight100PercentValues);
    </script>
</body>
</html>
