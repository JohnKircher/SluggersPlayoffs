<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Scores</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .games {
            flex: 1;
        }
        .standings {
            flex: 1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .input-group {
            margin-bottom: 10px;
        }
        .input-group label {
            display: inline-block;
            width: 150px;
        }
        .input-group input {
            width: 60px;
        }
    </style>
</head>
<body>
    <h1>Enter Scores for Remaining Games</h1>
    <div class="container">
        <div class="games">
            <form id="score-form">
                {% for i, game in remaining_games %}
                    {% set team1, team2 = game %}
                    <div class="input-group">
                        <label>{{ team1 }} vs {{ team2 }}:</label>
                        <input type="number" name="{{ team1 }}_score_{{ i }}" 
                               value="{{ request.form.get(team1 ~ '_score_' ~ i, 0) }}" required
                               oninput="updateScore('{{ team1 }}', '{{ team2 }}', {{ i }})">
                        <input type="number" name="{{ team2 }}_score_{{ i }}" 
                               value="{{ request.form.get(team2 ~ '_score_' ~ i, 0) }}" required
                               oninput="updateScore('{{ team1 }}', '{{ team2 }}', {{ i }})">
                    </div>
                {% endfor %}
            </form>
            <button onclick="resetScores()" style="margin-top: 20px; background: red; color: white; padding: 10px; border: none; cursor: pointer;">
                Reset Standings & Scores
            </button>
        </div>
        <div class="standings">
            <h2>Current Standings</h2>
            <div id="standings-table">
                {% include 'standings_table.html' %}
            </div>
        </div>
    </div>

    <script>
        function updateScore(team1, team2, index) {
            let score1 = document.querySelector(`input[name='${team1}_score_${index}']`).value;
            let score2 = document.querySelector(`input[name='${team2}_score_${index}']`).value;
            
            fetch('/update-score', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    team1: team1,
                    team2: team2,
                    score1: score1,
                    score2: score2,
                    index: index
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('standings-table').innerHTML = data.standings_html;
                document.getElementById('probabilities-table').innerHTML = data.probabilities_html;
            })
            .catch(error => console.error('Error updating score:', error));
        }

        function resetScores() {
            fetch('/reset-scores', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('standings-table').innerHTML = data.standings_html;
                document.querySelectorAll("input[type='number']").forEach(input => input.value = 0);
            })
            .catch(error => console.error('Error resetting scores:', error));
        }
    </script>
</body>
</html>
